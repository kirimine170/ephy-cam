name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shell validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository and scan template text
        run: python scripts/validate_repository.py --check-sensitive-patterns

      - name: Check reference host Python syntax
        run: >-
          python -m py_compile
          reference/xiao-esp32s3-sense/host/ephy_cam_reference.py

      - name: Check reference shell scripts
        run: |
          shellcheck reference/xiao-esp32s3-sense/scripts/*.sh
          bash -n reference/xiao-esp32s3-sense/scripts/*.sh
